# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (core -> core.nim) or a
# directory (spaces -> spaces/*.nim). Modules under no listed layer are
# unconstrained: the umbrella module re-exports everything.
[layers]
math
core
parallel
spaces
conversion
contrast
interpolation
palette
accessibility
theme
image
import
export
validation
c_api
wasm
cli

# Similarly-prefixed packages this repo may name in `requires` (ADR-0001).
# Empty today: UniColor depends on none. Non-domain infra (nim, NimContracts)
# is external and goes unchecked.
[engines]