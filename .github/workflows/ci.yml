name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the previous run's answer irrelevant: cancel it rather
# than pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The CI every Uni* engine runs, held once in lituus-lab/.github rather
    # than copied per repo. Pinned by commit: a moving ref here would be the
    # same unpinned dependency the family forbids everywhere else.
    uses: lituus-lab/.github/.github/workflows/uni-nim-library.yml@1088f7823a84fbf8255ac181c7f84682aa69e9e1
    permissions:
      # A called workflow cannot obtain more than the calling job grants.
      contents: read
      pages: write
      id-token: write
    with:
      library: UniColor
      module: unicolor
      python-smoke-test: py/tests/test_version.py

  wasm:
    name: WASM (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      # No runner image ships emscripten. Pin the SDK to the version the glue is
      # developed against: a future emcc major could move the wasm32 ABI or the
      # i64 / 20-byte struct marshalling the uc_wasm_* adapters rely on.
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.2
      - run: $GATE wasm
      - run: $GATE wasmTest
      - name: Upload WASM
        uses: actions/upload-artifact@v7
        with:
          name: unicolor-wasm
          path: |
            build/wasm/unicolor.wasm
            build/wasm/unicolor.js
            wasm/unicolor.js
            wasm/unicolor.d.ts

  all-green:
    name: All green
    # The one check branch protection requires, and the only name that has to
    # stay stable. `needs.ci.result` is the whole called workflow's verdict; a
    # repo with jobs of its own adds them here beside it.
    needs: [ci, wasm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for one in $results; do
            case "$one" in
              success) ;;
              skipped) ;;
              *) echo "all-green: a required job reported $one" >&2; exit 1 ;;
            esac
          done
