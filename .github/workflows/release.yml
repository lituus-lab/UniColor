name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    # The release every Uni* engine runs, held once in lituus-lab/.github
    # rather than copied per repo. Pinned by commit, like every other
    # dependency the family declares.
    uses: lituus-lab/.github/.github/workflows/uni-nim-release.yml@48140db006ceb8b317be066e8f46f6e185f31a0f
    permissions:
      # A called workflow cannot obtain more than the calling job grants:
      # contents to create the release, id-token for PyPI trusted publishing.
      contents: write
      id-token: write
    with:
      library: UniColor
      module: unicolor

  wasm:
    name: WASM (Emscripten)
    # After the release exists, not before: this packaging is UniColor's own --
    # its emcc factory, its ESM glue, its .d.ts -- so it stays here rather than
    # in the family workflow, and attaches itself to the release the shared
    # publish job just created.
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.2
      - run: nimble wasm
      - name: Package
        shell: bash
        run: |
          set -eu
          dir="UniColor-${GITHUB_REF_NAME}-wasm"
          mkdir -p "$dir"
          # The emcc MODULARIZE+EXPORT_ES6 factory, renamed so the release
          # glue's `./unicolor.wasm.js` candidate resolves; unicolor.wasm keeps
          # its basename to match emcc's baked internal reference (no locateFile).
          cp build/wasm/unicolor.wasm "$dir/unicolor.wasm"
          cp build/wasm/unicolor.js  "$dir/unicolor.wasm.js"
          cp wasm/unicolor.js        "$dir/unicolor.js"
          cp wasm/unicolor.d.ts      "$dir/unicolor.d.ts"
          # Self-contained ESM: the nearest package.json wins, so a consumer's
          # own type field (commonjs or module) cannot force the wrong parse on
          # the factory. EXPORT_ES6 makes both files real ES modules under it.
          printf '{"type":"module"}\n' > "$dir/package.json"
          cp LICENSE NOTICE "$dir/"
          cp wasm/README.md "$dir/README.md"
          tar czf "$dir.tar.gz" "$dir"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./*.tar.gz --clobber
