name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default: guard/cabi/wheels only build and upload artifacts.
# The publish job widens its own scope to cut the release.
permissions:
  contents: read

jobs:
  guard:
    name: Tag matches .nimble version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      # A tag disagreeing with the package version ships artifacts whose
      # embedded version lies. Refuse before anything is built.
      - run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version' UniColor.nimble | cut -d'"' -f2)
          declared_py=$(grep -m1 '^version = ' py/pyproject.toml | cut -d'"' -f2)
          # Prefix-agnostic on purpose: the macro is UNIMATH_VERSION in one repo
          # and UC_VERSION in another.
          declared_h=$(grep -m1 -E '^#define [A-Z_]+_VERSION "' include/UniColor.h | cut -d'"' -f2)
          echo "tag=$tag nimble=$declared python=$declared_py header=$declared_h"
          test "$tag" = "$declared"
          test "$tag" = "$declared_py"
          test "$tag" = "$declared_h"

  test:
    name: Nim tests (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - run: nimble testCi
      - run: nimble testCiRelease

  cabi:
    name: C ABI (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      # gcc arrives with Nim's MinGW, GNU make does not ship on the runner image.
      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      # Test the ABI before packaging it: a release that ships a lib failing
      # its own header test is worse than no release.
      - run: nimble ctest
      - run: nimble clibStatic
      - run: nimble clib
      - name: Package
        shell: bash
        run: |
          set -eu
          dir="UniColor-${GITHUB_REF_NAME}-${{ matrix.os }}"
          mkdir -p "$dir/include"
          cp include/UniColor.h "$dir/include/"
          cp libUniColor.* "$dir/"
          cp LICENSE NOTICE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: cabi-${{ matrix.os }}
          path: '*.tar.gz'

  wasm:
    name: WASM (Emscripten)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.2
      - run: nimble wasm
      - name: Package
        shell: bash
        run: |
          set -eu
          dir="UniColor-${GITHUB_REF_NAME}-wasm"
          mkdir -p "$dir"
          # The emcc MODULARIZE+EXPORT_ES6 factory, renamed so the release
          # glue's `./unicolor.wasm.js` candidate resolves; unicolor.wasm keeps
          # its basename to match emcc's baked internal reference (no locateFile).
          cp build/wasm/unicolor.wasm "$dir/unicolor.wasm"
          cp build/wasm/unicolor.js  "$dir/unicolor.wasm.js"
          cp wasm/unicolor.js        "$dir/unicolor.js"
          cp wasm/unicolor.d.ts      "$dir/unicolor.d.ts"
          # Self-contained ESM: the nearest package.json wins, so a consumer's
          # own type field (commonjs or module) cannot force the wrong parse on
          # the factory. EXPORT_ES6 makes both files real ES modules under it.
          printf '{"type":"module"}\n' > "$dir/package.json"
          cp LICENSE NOTICE "$dir/"
          cp wasm/README.md "$dir/README.md"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: '*.tar.gz'

  wheels:
    name: Wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # No Py_LIMITED_API/abi3 in setup.py: the extension is tied to each
        # CPython minor version's C ABI, so every one needs its own wheel.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -U setuptools wheel Cython pytest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: nimble pyLib
      # Build the extension in-place and run the test suite before packaging a
      # wheel -- a release wheel that fails its own tests is worse than no wheel.
      - run: cd py && python setup.py build_ext --inplace
      - run: cd py && python -m pytest -q
      - run: cd py && python setup.py bdist_wheel
      - name: Repair Wheel
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux)   pip install auditwheel && LD_LIBRARY_PATH="$GITHUB_WORKSPACE" auditwheel repair py/dist/*.whl -w dist/ ;;
            macOS)   pip install delocate   && DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE" delocate-wheel py/dist/*.whl -w dist/ ;;
            Windows) pip install delvewheel && delvewheel repair py/dist/*.whl -w dist/ ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -U setuptools wheel Cython
      # Vendors the Nim source into py/_nimsrc/ (setup.py's vendor_nim_source),
      # so `pip install --no-binary` can build it on a platform/Python version
      # with no prebuilt wheel -- nimble/nim must be on the installer's PATH.
      - run: cd py && python setup.py sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: py/dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [test, cabi, wheels, wasm, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: [test, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lituus-unicolor/
    permissions:
      # Trusted publishing (OIDC): no API token stored here. Requires a
      # one-time manual step on pypi.org -- add lituus-lab/UniColor,
      # workflow release.yml, environment pypi as a trusted publisher for
      # the unicolor project.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: ls dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # This tag can re-run after a version already has some files on
          # PyPI (e.g. adding a Python version or the sdist later) -- PyPI
          # rejects re-uploading an unchanged filename, so skip rather than
          # fail the whole job on files already published.
          skip-existing: true
